services:
  producer:
    build:
      context: ./Producer
      dockerfile: Dockerfile
    container_name: bike-producer
    depends_on:
      - kafka
    environment:
      KAFKA_CONNECTION: "kafka:9092"

  consumer:
    build:
      context: ./Consumer
      dockerfile: Dockerfile
    container_name: bike-consumer
    depends_on:
      - kafka
      - mysql
      - redis
      - mongodb
    environment:
      MYSQL_CONNECTION_STRING: "Server=mysql;Port=3306;Database=bikeStationDb;User=root;Password=secret;"
      REDIS_CONNECTION: "redis:6379"
      MONGO_CONNECTION: "mongodb://mongodb:27017"
      KAFKA_CONNECTION: "kafka:9092"

  mysql:
    image: mysql:8.0
    container_name: bike-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: bikeStationDb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql


  redis:
    image: redis:7
    container_name: bike-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:7
    container_name: bike-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  kafka:
    image: bitnami/kafka:3.7
    container_name: bike-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"


volumes:
  mysql_data:
  mongo_data:
